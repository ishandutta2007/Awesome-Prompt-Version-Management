<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    .node { animation: pulse 3s infinite alternate ease-in-out; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 20s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" />
  </g>

  <!-- Animated Dynamic Flow Lines -->
  <g stroke="url(#textGrad)" stroke-width="2" fill="none" opacity="0.4" class="flow-line">
    <path d="M 150 320 C 350 220, 450 350, 600 280 C 750 210, 850 330, 1050 240" />
    <path d="M 100 120 C 300 200, 500 100, 750 180 C 900 220, 1000 120, 1150 160" />
  </g>

  <!-- Glowing Nodes / Version Tag Graphics -->
  <g filter="url(#glow)">
    <circle cx="200" cy="280" r="8" fill="#38bdf8" />
    <circle cx="600" cy="280" r="10" fill="#818cf8" />
    <circle cx="1050" cy="240" r="8" fill="#c084fc" />
    <line x1="200" y1="280" x2="600" y2="280" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="600" y1="280" x2="1050" y2="240" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Version Pill Tags -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="12">
    <!-- Tag 1 -->
    <rect x="150" y="225" width="100" height="32" rx="16" fill="#0f172a" stroke="#38bdf8"/>
    <text x="200" y="246" class="badge-text" text-anchor="middle" fill="#38bdf8">v1.0.4-prompt</text>

    <!-- Tag 2 -->
    <rect x="540" y="215" width="120" height="36" rx="18" fill="#0f172a" stroke="#818cf8"/>
    <text x="600" y="238" class="badge-text" text-anchor="middle" fill="#818cf8">v2.1.0-eval-passed</text>

    <!-- Tag 3 -->
    <rect x="990" y="175" width="120" height="36" rx="18" fill="#0f172a" stroke="#c084fc"/>
    <text x="1050" y="198" class="badge-text" text-anchor="middle" fill="#c084fc">v3.0.0-prod-live</text>
  </g>

  <!-- Header & Description -->
  <g transform="translate(80, 110)">
    <!-- Terminal Icon Header -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <path d="M12 16 L20 22 L12 28 M24 28 L32 28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="60" y="36" class="title">Awesome Prompt Version Management</text>
    <text x="60" y="75" class="subtitle">The definitive directory for LLM prompt registries, observability &amp; evaluation stacks 🚀</text>
  </g>

  <!-- Feature Tags at Bottom Left -->
  <g transform="translate(80, 315)">
    <rect x="0" y="0" width="140" height="30" rx="8" fill="#1e293b"/>
    <text x="70" y="19" class="badge-text" text-anchor="middle">📦 Prompt Registries</text>

    <rect x="150" y="0" width="140" height="30" rx="8" fill="#1e293b"/>
    <text x="220" y="19" class="badge-text" text-anchor="middle">🔍 LLM Observability</text>

    <rect x="300" y="0" width="140" height="30" rx="8" fill="#1e293b"/>
    <text x="370" y="19" class="badge-text" text-anchor="middle">🧪 A/B Experiments</text>

    <rect x="450" y="0" width="140" height="30" rx="8" fill="#1e293b"/>
    <text x="520" y="19" class="badge-text" text-anchor="middle">⚡ Open-Source First</text>
  </g>
</svg>
